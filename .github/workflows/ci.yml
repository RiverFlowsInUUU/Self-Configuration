name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # check_releases 的诞生日期断言依赖完整 git 历史（--find-object 找版本 blob 首现提交），
          # shallow clone 会把所有日期退化成 push 当天 —— 必须全量拉取
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install pyyaml

      - name: Placeholder / credential scan
        run: python skill/tests/check_secrets.py

      - name: Portability (EOL / BOM / naming)
        run: python skill/tests/check_portability.py

      - name: Min-pair consistency
        run: python skill/tests/check_min_pair.py

      - name: README badge ↔ profiles counts
        run: python skill/tests/check_badges.py

      - name: Markdown links and anchors
        run: python skill/tests/check_links.py .

      - name: Releases scheme (tags / asset names / notes / coverage)
        run: python skill/tests/check_releases.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Surge DNS audit
        run: |
          python skill/scripts/surge/check_surge_dns.py surge/profiles/lazy.conf
          python skill/scripts/surge/check_surge_dns.py surge/profiles/routing.conf

      - name: Egern DNS audit
        run: python skill/scripts/egern/check_egern_dns.py egern/profiles/lazy.yaml egern/profiles/routing.yaml

      - name: .min drift check
        run: |
          python skill/tests/make_min.py
          git diff --exit-code
