name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # check_releases 的诞生日期断言依赖完整 git 历史（--find-object 找版本 blob 首现提交），
          # shallow clone 会把所有日期退化成 push 当天 —— 必须全量拉取
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install pyyaml

      - name: Placeholder / credential scan
        run: python skill/tests/check_secrets.py

      - name: Portability (EOL / BOM / naming)
        run: python skill/tests/check_portability.py

      - name: Min-pair consistency
        run: python skill/tests/check_min_pair.py

      - name: README badge ↔ profiles counts
        run: python skill/tests/check_badges.py

      - name: Markdown links and anchors
        run: python skill/tests/check_links.py .

      - name: Releases scheme (tags / asset names / notes / coverage)
        # 退出码：0=过 / 1=判负 / 2=环境不达标 / 3=SKIP（API 不可达）。CI 带 token，2 和 3 均视为失败（保守）
        run: python skill/tests/check_releases.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Surge DNS audit
        run: |
          python skill/scripts/surge/check_surge_dns.py surge/profiles/lazy.conf
          python skill/scripts/surge/check_surge_dns.py surge/profiles/routing.conf

      - name: Egern DNS audit
        run: python skill/scripts/egern/check_egern_dns.py egern/profiles/lazy.yaml egern/profiles/routing.yaml

      - name: .min drift check
        # --check（0929 起）：直接比对磁盘 .min 与生成器输出，有差异即非 0。
        # 旧写法「计划模式 + git diff」两半都恒空/恒 0，是永远绿的空操作（豆包审查实锤）。
        run: python skill/tests/make_min.py --check

      - name: Region-filter auditor discriminating power (negative fixtures)
        # 拿两份故意损坏的 fixture 证明地区组审计器**真的会拦住**漏同步，
        # 而不是只会对现役配置打一片 ✅（只测“好配置通过”证明不了判别力）。
        run: python skill/tests/check_region_filters.py

      - name: Encoding gate (cp936)
        # Windows 中文环境（ACP=936）下子进程 stdout 走管道时 Python 用 cp936 编码 ——
        # 脚本 print 一个非 GBK 字符（✅/❌/⚠️/⇒）就 UnicodeEncodeError 并以**退出码 1** 结束。
        # 1 恰是本仓「判负」的码 ⇒ 崩溃会被读成「判负」，整轮看着对、其实判据没跑。
        # 这里用 PYTHONIOENCODING=cp936 在 Linux 上等价复现该路径（cp936 是 gbk 别名、
        # 实现在 builtin _codecs_cn，平台无关）：缺保护的闸门脚本当场崩、当场红。
        # ⚠️ 顶替不了 check_portability 的 E4 —— 本步只覆盖 verify_all 跑到的脚本，
        #    E4 静态覆盖全部 .py（含 CI 不跑的审计脚本）。两者互补。
        # ⚠️ 不能再设 PYTHONUTF8=0：PYTHONIOENCODING 已能压过 UTF-8 模式（实测），
        #    而关掉 UTF-8 模式会连带改掉 Linux 上 open() 的默认编码，引入无关失败。
        run: python skill/tests/verify_all.py
        env:
          PYTHONIOENCODING: cp936
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
